name: Record PRs reusable capture
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: .
      install-command:
        type: string
        default: npm ci
      start-command:
        type: string
        default: npm run dev -- --host 127.0.0.1
      base-url:
        type: string
        default: http://127.0.0.1:3000
      config:
        type: string
        default: webreel.config.json
      journey-map:
        type: string
        default: ''
      node-version:
        type: string
        default: '24'
      bun-version:
        type: string
        default: '1.4.2'
      retention-days:
        type: string
        default: '14'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - uses: matijagrcic/record-prs@v1.0.5
        with:
          working-directory: ${{ inputs.working-directory }}
          install-command: ${{ inputs.install-command }}
          start-command: ${{ inputs.start-command }}
          base-url: ${{ inputs.base-url }}
          config: ${{ inputs.config }}
          journey-map: ${{ inputs.journey-map }}
          retention-days: ${{ inputs.retention-days }}
