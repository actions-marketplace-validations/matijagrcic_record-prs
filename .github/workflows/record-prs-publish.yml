name: Publish PR recordings
on:
  workflow_run:
    workflows: [Record PRs]
    types: [completed]
permissions:
  actions: read
  pull-requests: write
concurrency:
  group: record-prs-publish-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: matijagrcic/record-prs/publish@v1.0.2
        with:
          github-token: ${{ github.token }}
          media-token: ${{ secrets.PR_MEDIA_TOKEN }}
