name: Record PRs
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
permissions:
  contents: read
concurrency:
  group: record-prs-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  record:
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'app: web-ui')
    uses: matijagrcic/record-prs/.github/workflows/capture.yml@v1.0.2
    with:
      install-command: npm ci
      start-command: npm run dev -- --host 127.0.0.1
      base-url: http://127.0.0.1:3000
      config: webreel.config.json
